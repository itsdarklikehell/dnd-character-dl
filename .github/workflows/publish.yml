name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Solo el dueno del repositorio puede disparar una publicacion.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # El paquete no tiene dependencias, asi que no hace falta instalar nada.
      - run: pnpm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Permite al GITHUB_TOKEN del run escribir en GitHub Packages.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Comprobar que la version del release coincide con package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "El tag del release ($tag) no coincide con package.json ($pkg)." >&2
            exit 1
          fi

      # Se escribe el .npmrc a mano en vez de usar el registry-url de
      # setup-node, porque ese genera un .npmrc de usuario que pnpm no siempre
      # toma en cuenta. Este queda junto al package.json y pnpm si lo lee.
      - name: Autenticar contra GitHub Packages
        run: |
          {
            echo "@abr4xas:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}"
          } > .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --no-git-checks: en el runner el checkout esta en un tag suelto, no en
      # una rama sincronizada, y pnpm lo rechazaria.
      - run: pnpm publish --no-git-checks
