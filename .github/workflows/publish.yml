name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Solo el dueno del repositorio puede disparar una publicacion.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Necesario para el trusted publishing de npm via OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # El trusted publishing exige npm 11.5.1 o superior.
      - run: npm install -g npm@latest

      - name: Comprobar que la version del release coincide con package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "El tag del release ($tag) no coincide con package.json ($pkg)." >&2
            exit 1
          fi

      # Sin NODE_AUTH_TOKEN: la autenticacion sale del OIDC de Actions, y npm
      # anade las atestaciones de procedencia por su cuenta.
      - run: npm publish
